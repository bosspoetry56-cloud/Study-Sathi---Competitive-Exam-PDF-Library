<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Sathi - Mathematics Mock Test</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 50% -10%,#292929 0,#0b0b0b 38%,#030303 100%);
  color:#fff;
  min-height:100vh;
}

.header{
  position:sticky;
  top:0;
  z-index:100;
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
  background:rgba(5,5,5,.94);
  border-bottom:1px solid #292929;
  backdrop-filter:blur(12px);
}

.logo{
  font-size:21px;
  font-weight:800;
}

.logo span{
  color:#888;
}

.timer{
  min-width:92px;
  text-align:center;
  padding:10px 14px;
  border:1px solid #444;
  border-radius:14px;
  background:#151515;
  font-weight:800;
}

.timer.warning{
  background:#fff;
  color:#000;
  border-color:#fff;
}

.hero{
  text-align:center;
  padding:30px 15px 20px;
}

.hero h1{
  font-size:28px;
  margin-bottom:7px;
}

.hero p{
  color:#999;
  font-size:14px;
}

.container{
  width:min(850px,94%);
  margin:auto;
  padding:5px 0 50px;
}

/* QUESTION NUMBERS */

.nav{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  margin:5px 0 17px;
}

.nav button{
  width:38px;
  height:38px;
  border-radius:50%;
  border:1px solid #444;
  background:#111;
  color:#aaa;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

.nav button.current{
  background:#fff;
  color:#000;
  border-color:#fff;
  transform:scale(1.08);
}

.nav button.answered{
  color:#fff;
  border-color:#aaa;
}

/* PROGRESS */

.progress{
  height:4px;
  width:100%;
  background:#222;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:18px;
}

.progressBar{
  height:100%;
  width:10%;
  background:#fff;
  transition:.3s;
}

/* QUESTION CARD */

.questionCard{
  background:#fff;
  color:#111;
  border-radius:24px;
  padding:30px;
  min-height:455px;
  box-shadow:0 20px 70px rgba(0,0,0,.55);
  animation:slide .25s ease;
}

@keyframes slide{
  from{
    opacity:0;
    transform:translateX(22px);
  }
  to{
    opacity:1;
    transform:translateX(0);
  }
}

.qNumber{
  color:#777;
  font-size:12px;
  font-weight:800;
  letter-spacing:1px;
  margin-bottom:15px;
}

.question{
  font-size:22px;
  line-height:1.5;
  font-weight:700;
  margin-bottom:24px;
}

/* OPTIONS */

.options{
  display:grid;
  gap:12px;
}

.option{
  width:100%;
  min-height:58px;
  display:flex;
  align-items:center;
  gap:13px;
  padding:13px 16px;
  background:#fafafa;
  color:#111;
  border:1.5px solid #ddd;
  border-radius:15px;
  text-align:left;
  cursor:pointer;
  transition:
    background .2s,
    border .2s,
    box-shadow .2s,
    transform .15s;
}

.option:hover{
  border-color:#999;
  background:#f3f3f3;
  transform:translateY(-1px);
}

.option.selected{
  background:#f0f0f0;
  border-color:#111;
  box-shadow:
    0 0 0 3px rgba(0,0,0,.07),
    0 8px 25px rgba(0,0,0,.12);
}

.radio{
  width:23px;
  height:23px;
  min-width:23px;
  border:2px solid #999;
  border-radius:50%;
  background:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  transition:.2s;
}

.option.selected .radio{
  border-color:#111;
}

.option.selected .radio:after{
  content:"";
  width:11px;
  height:11px;
  border-radius:50%;
  background:#111;
  animation:pop .18s ease;
}

@keyframes pop{
  from{
    transform:scale(.2);
  }
  to{
    transform:scale(1);
  }
}

.letter{
  font-weight:800;
}

/* BUTTONS */

.controls{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-top:18px;
}

.btn{
  padding:13px 22px;
  border-radius:12px;
  font-weight:800;
  border:1px solid #444;
  cursor:pointer;
}

.prev{
  background:#151515;
  color:#fff;
}

.next,
.submit{
  background:#fff;
  color:#000;
}

.submit{
  display:none;
}

/* RESULT */

.result{
  display:none;
  background:#fff;
  color:#111;
  border-radius:24px;
  padding:30px;
  margin-top:20px;
}

.score{
  text-align:center;
  font-size:34px;
  font-weight:900;
  margin-bottom:8px;
}

.resultText{
  text-align:center;
  color:#666;
  margin-bottom:28px;
}

.solution{
  border-top:1px solid #ddd;
  padding:22px 0;
}

.solution h3{
  font-size:17px;
  line-height:1.5;
  margin-bottom:10px;
}

.correct{
  color:#16803c;
  font-weight:700;
}

.wrong{
  color:#d62828;
  font-weight:700;
}

.explain{
  background:#f4f4f4;
  padding:13px;
  border-radius:10px;
  margin-top:10px;
  line-height:1.6;
}

.odia{
  background:#f1f1f1;
  padding:13px;
  border-radius:10px;
  margin-top:9px;
  line-height:1.7;
}

.restart{
  width:100%;
  margin-top:20px;
  background:#111;
  color:#fff;
}

/* MOBILE */

@media(max-width:600px){

  .header{
    padding:0 4%;
  }

  .logo{
    font-size:18px;
  }

  .timer{
    min-width:82px;
    font-size:14px;
  }

  .hero h1{
    font-size:23px;
  }

  .questionCard{
    padding:22px;
    min-height:480px;
  }

  .question{
    font-size:19px;
  }

  .option{
    min-height:56px;
    padding:12px;
  }

  .controls .btn{
    padding:12px 16px;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="logo">
    📚 Study <span>Sathi</span>
  </div>

  <div class="timer" id="timer">
    15:00
  </div>

</header>

<section class="hero">
  <h1>🧮 Mathematics Mock Test</h1>
  <p>10 Questions • 15 Minutes • Detailed Solutions</p>
</section>

<main class="container">

  <div class="nav" id="nav"></div>

  <div class="progress">
    <div class="progressBar" id="progressBar"></div>
  </div>

  <div class="questionCard" id="questionCard"></div>

  <div class="controls" id="controls">

    <button class="btn prev"
            id="prevBtn"
            onclick="previousQuestion()">
      ← Previous
    </button>

    <button class="btn next"
            id="nextBtn"
            onclick="nextQuestion()">
      Next →
    </button>

    <button class="btn submit"
            id="submitBtn"
            onclick="submitQuiz()">
      Submit Test
    </button>

  </div>

  <div class="result" id="result">

    <div class="score" id="score"></div>

    <div class="resultText" id="resultText"></div>

    <h2>📖 Detailed Solutions</h2>

    <div id="solutions"></div>

    <button class="btn restart"
            onclick="location.reload()">
      🔄 Retake Mock Test
    </button>

  </div>

</main>

<script>

const questions=[

{
q:"To pass an examination, a candidate needs 36% marks. A student scores 190 marks and fails by 35 marks. What is the maximum marks for the examination?",
o:["500","550","625","650","700"],
a:2,
s:"Passing marks = 190 + 35 = 225. Therefore 36% of maximum marks = 225. Maximum marks = 225 × 100 ÷ 36 = 625.",
od:"ପାସ୍ ମାର୍କ = 190 + 35 = 225। ଏହା ମୋଟ ମାର୍କର 36%। ତେଣୁ ମୋଟ ମାର୍କ = 225 × 100 ÷ 36 = 625।"
},

{
q:"A shopkeeper marks an article 40% above its cost price and allows a discount of 20% on the marked price. What is his overall profit percentage?",
o:["10%","12%","15%","18%","20%"],
a:1,
s:"Let CP = 100. MP = 140. After 20% discount, SP = 140 × 80/100 = 112. Profit = 12%.",
od:"CP = 100 ଧରିଲେ MP = 140। 20% discount ପରେ SP = 112। Profit = 112 − 100 = 12%।"
},

{
q:"Two numbers are in the ratio 3 : 5. If 9 is subtracted from each number, the ratio becomes 12 : 23. What is the smaller number?",
o:["27","33","36","45","55"],
a:1,
s:"Let numbers be 3x and 5x. (3x−9)/(5x−9)=12/23. Solving gives x=11. Smaller number = 3×11 = 33.",
od:"ସଂଖ୍ୟା ଦୁଇଟି 3x ଓ 5x। (3x−9)/(5x−9)=12/23। ସମାଧାନ କଲେ x = 11। ଛୋଟ ସଂଖ୍ୟା = 3×11 = 33।"
},

{
q:"The ratio of the present ages of a father and his son is 5 : 2. Four years hence, the ratio of their ages will be 11 : 5. What is the present age of the father?",
o:["35 years","40 years","45 years","50 years","60 years"],
a:1,
s:"Let ages be 5x and 2x. Four years later, (5x+4)/(2x+4)=11/5. Solving gives x=8. Father's age = 40 years.",
od:"ବର୍ତ୍ତମାନ ବୟସ 5x ଓ 2x। 4 ବର୍ଷ ପରେ (5x+4)/(2x+4)=11/5। x=8। ବାପାଙ୍କ ବୟସ = 5×8 = 40 ବର୍ଷ।"
},

{
q:"A can complete a piece of work in 15 days and B can complete the same work in 20 days. They work together for 4 days, and then A leaves. In how many more days will B alone finish the remaining work?",
o:["9⅓ days","10⅔ days","11 days","12 days","13⅓ days"],
a:1,
s:"A's rate = 1/15, B's rate = 1/20. Together = 7/60. In 4 days = 7/15. Remaining = 8/15. B needs (8/15) ÷ (1/20) = 10⅔ days.",
od:"A ର 1 ଦିନର କାମ = 1/15, B ର = 1/20। ମିଶି = 7/60। 4 ଦିନରେ = 7/15। ବାକି = 8/15। B ଏହାକୁ 10⅔ ଦିନରେ କରିବ।"
},

{
q:"Pipe A can fill a tank in 12 hours and Pipe B can fill it in 15 hours. Pipe C can empty the full tank in 20 hours. If all three pipes are opened simultaneously, how much time will it take to fill the tank completely?",
o:["8 hours","10 hours","12 hours","14 hours","16 hours"],
a:1,
s:"Net rate = 1/12 + 1/15 − 1/20 = 1/10. Therefore the tank will fill in 10 hours.",
od:"Net rate = 1/12 + 1/15 − 1/20 = 1/10। ତେଣୁ tank ସମ୍ପୂର୍ଣ୍ଣ ଭରିବାକୁ 10 ଘଣ୍ଟା ଲାଗିବ।"
},

{
q:"If a person travels at 30 km/h, he reaches his office 10 minutes late. If he increases his speed to 40 km/h, he reaches 5 minutes early. What is the distance between his home and office?",
o:["25 km","30 km","35 km","40 km","45 km"],
a:1,
s:"Time difference = 15 minutes = 1/4 hour. D/30 − D/40 = 1/4. Therefore D = 30 km.",
od:"ସମୟ ତଫାତ = 15 ମିନିଟ୍ = 1/4 ଘଣ୍ଟା। D/30 − D/40 = 1/4। ତେଣୁ D = 30 km।"
},

{
q:"A 180 m long train is running at 54 km/h. How many seconds will it take to completely cross a platform that is 320 m long?",
o:["25 seconds","30⅓ seconds","33⅓ seconds","36 seconds","40 seconds"],
a:2,
s:"Total distance = 180 + 320 = 500 m. 54 km/h = 15 m/s. Time = 500/15 = 33⅓ seconds.",
od:"ମୋଟ ଦୂରତା = 180 + 320 = 500 m। 54 km/h = 15 m/s। ସମୟ = 500/15 = 33⅓ ସେକେଣ୍ଡ।"
},

{
q:"The speed of a boat in still water is 10 km/h and the speed of the stream is 2 km/h. The boat travels 24 km upstream and returns downstream. What is the total time?",
o:["4 hours","5 hours","5 hours 30 minutes","6 hours","6 hours 30 minutes"],
a:1,
s:"Upstream speed = 10−2 = 8 km/h. Downstream speed = 10+2 = 12 km/h. Total time = 24/8 + 24/12 = 5 hours.",
od:"Upstream speed = 10−2 = 8 km/h। Downstream speed = 10+2 = 12 km/h। ମୋଟ ସମୟ = 24/8 + 24/12 = 5 ଘଣ୍ଟା।"
},

{
q:"The difference between compound interest and simple interest on a certain sum at 10% per annum for 2 years is ₹65. What is the principal sum?",
o:["₹5,500","₹6,000","₹6,500","₹7,000","₹7,500"],
a:2,
s:"For 2 years, CI−SI = P × (R/100)². Therefore 65 = P × (10/100)² = P/100. P = ₹6,500.",
od:"2 ବର୍ଷ ପାଇଁ CI−SI = P × (10/100)²। 65 = P/100। ତେଣୁ Principal = ₹6,500।"
}

];

let current=0;
let selected=Array(questions.length).fill(null);
let time=15*60;
let submitted=false;

function render(){

  const q=questions[current];

  let html=`
    <div class="qNumber">
      QUESTION ${current+1} OF ${questions.length}
    </div>

    <div class="question">
      ${q.q}
    </div>

    <div class="options">
  `;

  q.o.forEach((option,i)=>{

    html+=`
      <button class="option ${selected[current]===i?"selected":""}"
              onclick="choose(${i})">

        <span class="radio"></span>

        <span>
          <span class="letter">
            ${String.fromCharCode(65+i)})
          </span>
          ${option}
        </span>

      </button>
    `;

  });

  html+=`</div>`;

  document.getElementById("questionCard").innerHTML=html;

  updateNav();

  document.getElementById("progressBar").style.width=
    ((current+1)/questions.length*100)+"%";

  document.getElementById("prevBtn").style.visibility=
    current===0?"hidden":"visible";

  document.getElementById("nextBtn").style.display=
    current===questions.length-1?"none":"block";

  document.getElementById("submitBtn").style.display=
    current===questions.length-1?"block":"none";
}

function choose(i){

  selected[current]=i;

  render();
}

function updateNav(){

  const nav=document.getElementById("nav");

  nav.innerHTML="";

  questions.forEach((q,i)=>{

    const b=document.createElement("button");

    b.textContent=i+1;

    if(i===current)
      b.classList.add("current");

    if(selected[i]!==null)
      b.classList.add("answered");

    b.onclick=()=>{
      current=i;
      render();
    };

    nav.appendChild(b);
  });
}

function nextQuestion(){

  if(current<questions.length-1){
    current++;
    render();
  }
}

function previousQuestion(){

  if(current>0){
    current--;
    render();
  }
}

function submitQuiz(){

  if(submitted)return;

  submitted=true;
  clearInterval(clock);

  let score=0;

  questions.forEach((q,i)=>{
    if(selected[i]===q.a)score++;
  });

  document.getElementById("questionCard").style.display="none";
  document.getElementById("nav").style.display="none";
  document.querySelector(".progress").style.display="none";
  document.getElementById("controls").style.display="none";

  document.getElementById("score").textContent=
    `Your Score: ${score} / 10`;

  document.getElementById("resultText").textContent=
    `You scored ${score*10}%. Check your detailed solutions below.`;

  let solutionHTML="";

  questions.forEach((q,i)=>{

    const correct=selected[i]===q.a;

    const user=
      selected[i]===null
      ?"Not Attempted"
      :q.o[selected[i]];

    solutionHTML+=`
      <div class="solution">

        <h3>
          ${i+1}. ${q.q}
        </h3>

        <p class="${correct?"correct":"wrong"}">
          Your Answer: ${user}
        </p>

        <p style="margin-top:7px">
          <strong>
            Correct Answer:
          </strong>
          ${String.fromCharCode(65+q.a)}) ${q.o[q.a]}
        </p>

        <div class="explain">
          <strong>English Solution:</strong><br>
          ${q.s}
        </div>

        <div class="odia">
          <strong>ଓଡ଼ିଆ Solution:</strong><br>
          ${q.od}
        </div>

      </div>
    `;
  });

  document.getElementById("solutions").innerHTML=solutionHTML;

  document.getElementById("result").style.display="block";

  document.getElementById("result")
    .scrollIntoView({behavior:"smooth"});
}

const clock=setInterval(()=>{

  if(time<=0){

    clearInterval(clock);

    if(!submitted)
      submitQuiz();

    return;
  }

  time--;

  const minutes=Math.floor(time/60);
  const seconds=time%60;

  document.getElementById("timer").textContent=
    String(minutes).padStart(2,"0")+":"+
    String(seconds).padStart(2,"0");

  if(time<=60){
    document.getElementById("timer")
      .classList.add("warning");
  }

},1000);

render();

</script>

</body>
</html>
