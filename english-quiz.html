<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study Sathi - English Vocabulary Mock Test</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#050505;
    color:#111;
    min-height:100vh;
}

.header{
    height:70px;
    background:#0b0b0b;
    border-bottom:1px solid #242424;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    color:white;
}

.logo{
    font-size:23px;
    font-weight:800;
}

.logo span{
    color:#999;
}

.timer{
    background:#fff;
    color:#000;
    padding:10px 17px;
    border-radius:10px;
    font-weight:800;
    min-width:90px;
    text-align:center;
}

.hero{
    text-align:center;
    color:white;
    padding:25px 15px 15px;
}

.hero h1{
    font-size:28px;
    margin-bottom:5px;
}

.hero p{
    color:#aaa;
    font-size:14px;
}

.container{
    max-width:850px;
    margin:auto;
    padding:15px;
}

.progress-wrap{
    display:flex;
    gap:7px;
    margin-bottom:18px;
}

.progress{
    height:5px;
    flex:1;
    background:#303030;
    border-radius:10px;
}

.progress.active{
    background:#fff;
}

.question-card{
    background:#fff;
    border-radius:20px;
    padding:30px;
    min-height:420px;
    box-shadow:0 15px 50px rgba(255,255,255,.05);
}

.question-number{
    color:#777;
    font-size:13px;
    font-weight:bold;
    margin-bottom:15px;
}

.question-card h2{
    font-size:23px;
    line-height:1.4;
    margin-bottom:25px;
}

.options{
    display:grid;
    gap:12px;
}

.option{
    width:100%;
    border:2px solid #e5e5e5;
    background:#fafafa;
    padding:15px;
    border-radius:12px;
    text-align:left;
    font-size:15px;
    cursor:pointer;
    transition:.2s;
}

.option:hover{
    border-color:#111;
}

.option.selected{
    background:#111;
    color:white;
    border-color:#111;
}

.controls{
    display:flex;
    justify-content:space-between;
    gap:12px;
    margin-top:20px;
}

.btn{
    border:0;
    padding:13px 25px;
    border-radius:11px;
    font-weight:bold;
    cursor:pointer;
    font-size:14px;
}

.prev{
    background:#292929;
    color:white;
}

.next{
    background:white;
    color:#111;
}

.submit{
    background:#fff;
    color:#000;
    display:none;
}

.nav{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:7px;
    margin:20px 0;
}

.nav button{
    width:38px;
    height:38px;
    border-radius:9px;
    border:1px solid #444;
    background:#151515;
    color:white;
    cursor:pointer;
}

.nav button.current{
    background:white;
    color:black;
}

.nav button.answered{
    border-color:white;
}

.result{
    display:none;
    background:white;
    border-radius:20px;
    padding:30px;
    margin-top:20px;
}

.score{
    text-align:center;
    font-size:32px;
    font-weight:800;
    margin-bottom:10px;
}

.result-msg{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}

.solution{
    border-top:1px solid #ddd;
    padding:22px 0;
}

.solution h3{
    margin-bottom:12px;
}

.answer{
    font-weight:bold;
    margin-bottom:12px;
}

.eng{
    margin-bottom:8px;
}

.odia{
    background:#f5f5f5;
    padding:12px;
    border-radius:10px;
    margin-top:8px;
}

.restart{
    width:100%;
    background:#111;
    color:white;
    margin-top:20px;
}

@media(max-width:600px){

    .header{
        padding:0 4%;
    }

    .logo{
        font-size:19px;
    }

    .hero h1{
        font-size:23px;
    }

    .question-card{
        padding:22px;
        min-height:430px;
    }

    .question-card h2{
        font-size:20px;
    }

    .controls .btn{
        padding:12px 17px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">
        📚 Study <span>Sathi</span>
    </div>

    <div class="timer" id="timer">
        15:00
    </div>

</header>


<section class="hero">

    <h1>📘 English Vocabulary Mock Test</h1>

    <p>15 Questions • 15 Minutes • Synonyms, Antonyms & Fill in the Blanks</p>

</section>


<div class="container">

    <div class="progress-wrap" id="progress"></div>

    <div class="nav" id="nav"></div>

    <div class="question-card" id="questionCard"></div>

    <div class="controls">

        <button class="btn prev" id="prevBtn" onclick="previousQuestion()">
            ← Previous
        </button>

        <button class="btn next" id="nextBtn" onclick="nextQuestion()">
            Next →
        </button>

        <button class="btn submit" id="submitBtn" onclick="submitQuiz()">
            Submit Test
        </button>

    </div>


    <div class="result" id="result">

        <div class="score" id="score"></div>

        <div class="result-msg" id="resultMsg"></div>

        <h2>📖 Detailed Solutions</h2>

        <div id="solutions"></div>

        <button class="btn restart" onclick="location.reload()">
            🔄 Retake Quiz
        </button>

    </div>

</div>


<script>

const questions = [

{
q:"CANDID",
type:"Choose the word nearest in meaning.",
options:[
"Secretive",
"Frank",
"Deceitful",
"Arrogant"
],
answer:1,
solution:"Candid means honest, frank and straightforward.",
odia:"Candid ra artha hela ସଚ୍ଚୋଟ, ଖୋଲାଖୋଲି ବା ସିଧାସଳଖ କଥା କହୁଥିବା।",
why:"Frank means honest and direct."
},

{
q:"MITIGATE",
type:"Choose the word nearest in meaning.",
options:[
"Intensify",
"Alleviate",
"Aggregate",
"Expand"
],
answer:1,
solution:"Mitigate means to make something less severe, painful or serious.",
odia:"Mitigate ra artha hela କୌଣସି ଜିନିଷର ତୀବ୍ରତା, କଷ୍ଟ ବା ଗମ୍ଭୀରତାକୁ କମାଇବା।",
why:"Alleviate means to reduce or relieve."
},

{
q:"METICULOUS",
type:"Choose the word nearest in meaning.",
options:[
"Careless",
"Painstaking",
"Hasty",
"Generous"
],
answer:1,
solution:"Meticulous means extremely careful and paying attention to every detail.",
odia:"Meticulous ra artha hela ପ୍ରତ୍ୟେକ ଛୋଟ ଛୋଟ ବିଷୟ ପ୍ରତି ଅତ୍ୟନ୍ତ ସାବଧାନ ଓ ଯତ୍ନଶୀଳ।",
why:"Painstaking means done with great care and effort."
},

{
q:"PRAGMATIC",
type:"Choose the word nearest in meaning.",
options:[
"Realistic",
"Theoretical",
"Idealistic",
"Rigid"
],
answer:0,
solution:"Pragmatic means dealing with problems in a practical and realistic way.",
odia:"Pragmatic ra artha hela ବ୍ୟବହାରିକ ଓ ବାସ୍ତବବାଦୀ।",
why:"Realistic means practical and based on actual conditions."
},

{
q:"LETHARGIC",
type:"Choose the word nearest in meaning.",
options:[
"Active",
"Sluggish",
"Enthusiastic",
"Clever"
],
answer:1,
solution:"Lethargic means having little energy or being slow and inactive.",
odia:"Lethargic ra artha hela ଅଳସ, ନିଷ୍କ୍ରିୟ ବା ଶକ୍ତିହୀନ।",
why:"Sluggish means slow and lacking energy."
},

{
q:"OBSOLETE",
type:"Choose the word opposite in meaning.",
options:[
"Outdated",
"Ancient",
"Contemporary",
"Archaic"
],
answer:2,
solution:"Obsolete means no longer useful or current.",
odia:"Obsolete ra artha hela ପୁରୁଣା ଓ ଆଉ ବ୍ୟବହାରରେ ନଥିବା।",
why:"Contemporary means modern or belonging to the present time."
},

{
q:"FRUGAL",
type:"Choose the word opposite in meaning.",
options:[
"Economical",
"Extravagant",
"Thrifty",
"Miserly"
],
answer:1,
solution:"Frugal means economical and careful about spending money.",
odia:"Frugal ra artha hela ମିତବ୍ୟୟୀ ବା ଖର୍ଚ୍ଚ କରିବାରେ ସାବଧାନ।",
why:"Extravagant means spending more than necessary."
},

{
q:"HOSTILE",
type:"Choose the word opposite in meaning.",
options:[
"Aggressive",
"Friendly",
"Antagonistic",
"Violent"
],
answer:1,
solution:"Hostile means unfriendly, aggressive or opposed.",
odia:"Hostile ra artha hela ଶତ୍ରୁତାପୂର୍ଣ୍ଣ ବା ଅମିତ୍ରସୁଲଭ।",
why:"Friendly is the opposite of hostile."
},

{
q:"TRANQUIL",
type:"Choose the word opposite in meaning.",
options:[
"Calm",
"Peaceful",
"Agitated",
"Serene"
],
answer:2,
solution:"Tranquil means calm, peaceful and free from disturbance.",
odia:"Tranquil ra artha hela ଶାନ୍ତ, ପ୍ରଶାନ୍ତ ଓ ଅଶାନ୍ତିହୀନ।",
why:"Agitated means disturbed, restless or excited."
},

{
q:"VAGUE",
type:"Choose the word opposite in meaning.",
options:[
"Obscure",
"Precise",
"Hazy",
"Dim"
],
answer:1,
solution:"Vague means unclear, uncertain or not definite.",
odia:"Vague ra artha hela ଅସ୍ପଷ୍ଟ, ଅନିର୍ଦ୍ଦିଷ୍ଟ ବା ସ୍ପଷ୍ଟ ନୁହେଁ।",
why:"Precise means exact and clearly defined."
},

{
q:"The government decided to ________ the old tax law and introduce a simpler system.",
type:"Fill in the blank.",
options:[
"establish",
"repeal",
"enforce",
"construct"
],
answer:1,
solution:"Repeal means officially cancel or abolish a law.",
odia:"Repeal ra artha hela କୌଣସି ଆଇନକୁ ଆନୁଷ୍ଠାନିକ ଭାବରେ ବାତିଲ କରିବା।",
why:"The sentence says the old tax law was cancelled."
},

{
q:"His ________ handling of the crisis prevented a major conflict between the two groups.",
type:"Fill in the blank.",
options:[
"tactful",
"clumsy",
"negligent",
"reckless"
],
answer:0,
solution:"Tactful means dealing with people or difficult situations carefully and sensitively.",
odia:"Tactful ra artha hela ପରିସ୍ଥିତିକୁ ବୁଦ୍ଧିମତା ଓ ସାବଧାନତାର ସହିତ ପରିଚାଳନା କରିବା।",
why:"His careful handling prevented conflict."
},

{
q:"She has an ________ memory and can recall events from her childhood with ease.",
type:"Fill in the blank.",
options:[
"ephemeral",
"exceptional",
"ordinary",
"ambiguous"
],
answer:1,
solution:"Exceptional means unusually good or outstanding.",
odia:"Exceptional ra artha hela ଅସାଧାରଣ ବା ସାଧାରଣଠାରୁ ବହୁତ ଭଲ।",
why:"She can remember childhood events very easily."
},

{
q:"The teacher asked the students not to ________ the rules of the institution.",
type:"Fill in the blank.",
options:[
"follow",
"adhere",
"flout",
"obey"
],
answer:2,
solution:"Flout means to openly disobey or show disrespect for a rule.",
odia:"Flout ra artha hela ଜାଣିଶୁଣି ନିୟମକୁ ଅମାନ୍ୟ କରିବା।",
why:"The sentence asks students not to break the rules."
},

{
q:"Due to heavy rainfall, the match was ________ until further notice.",
type:"Fill in the blank.",
options:[
"expedited",
"cancelled",
"adjourned",
"terminated"
],
answer:2,
solution:"Adjourned means postponed or suspended until a later time.",
odia:"Adjourned ra artha hela କୌଣସି କାର୍ଯ୍ୟ ବା ଖେଳକୁ ପରବର୍ତ୍ତୀ ସମୟ ପର୍ଯ୍ୟନ୍ତ ସ୍ଥଗିତ କରିବା।",
why:"The match was postponed because of heavy rainfall."
}

];

let current = 0;
let selected = new Array(questions.length).fill(null);
let timeLeft = 15 * 60;
let submitted = false;


function createProgress(){

    const progress = document.getElementById("progress");

    progress.innerHTML = "";

    questions.forEach((q,i)=>{

        const bar = document.createElement("div");

        bar.className = "progress" +
            (i === current ? " active" : "");

        progress.appendChild(bar);

    });

}


function createNav(){

    const nav = document.getElementById("nav");

    nav.innerHTML = "";

    questions.forEach((q,i)=>{

        const btn = document.createElement("button");

        btn.innerText = i + 1;

        if(i === current){
            btn.classList.add("current");
        }

        if(selected[i] !== null){
            btn.classList.add("answered");
        }

        btn.onclick = function(){
            current = i;
            renderQuestion();
        };

        nav.appendChild(btn);

    });

}


function renderQuestion(){

    const q = questions[current];

    const card = document.getElementById("questionCard");

    let html = `

        <div class="question-number">
            QUESTION ${current + 1} OF ${questions.length}
        </div>

        <h2>${q.q}</h2>

        <p style="color:#777;margin-bottom:15px;">
            ${q.type}
        </p>

        <div class="options">
    `;

    q.options.forEach((option,index)=>{

        html += `

            <button
                class="option ${
                    selected[current] === index
                    ? "selected"
                    : ""
                }"
                onclick="selectOption(${index})">

                ${String.fromCharCode(65 + index)}) ${option}

            </button>

        `;

    });

    html += `</div>`;

    card.innerHTML = html;

    document.getElementById("prevBtn").style.visibility =
        current === 0 ? "hidden" : "visible";

    document.getElementById("nextBtn").style.display =
        current === questions.length - 1
        ? "none"
        : "block";

    document.getElementById("submitBtn").style.display =
        current === questions.length - 1
        ? "block"
        : "none";

    createProgress();
    createNav();

}


function selectOption(index){

    selected[current] = index;

    renderQuestion();

}


function nextQuestion(){

    if(current < questions.length - 1){

        current++;

        renderQuestion();

    }

}


function previousQuestion(){

    if(current > 0){

        current--;

        renderQuestion();

    }

}


function submitQuiz(){

    if(submitted) return;

    submitted = true;

    clearInterval(timer);

    let score = 0;

    questions.forEach((q,i)=>{

        if(selected[i] === q.answer){

            score++;

        }

    });

    document.getElementById("questionCard").style.display = "none";

    document.getElementById("nav").style.display = "none";

    document.getElementById("progress").style.display = "none";

    document.querySelector(".controls").style.display = "none";

    document.getElementById("score").innerText =
        "Your Score: " + score + " / " + questions.length;

    document.getElementById("resultMsg").innerText =
        "You scored " +
        Math.round(score / questions.length * 100) +
        "%. Check the English + Odia solutions below.";

    const solutions =
        document.getElementById("solutions");

    solutions.innerHTML = "";

    questions.forEach((q,i)=>{

        const div = document.createElement("div");

        div.className = "solution";

        const userAnswer =
            selected[i] === null
            ? "Not Attempted"
            : q.options[selected[i]];

        const correct =
            q.options[q.answer];

        const status =
            selected[i] === q.answer
            ? "correct"
            : "wrong";

        div.innerHTML = `

            <h3>
                ${i+1}. ${q.q}
            </h3>

            <p class="answer">
                Correct Answer:
                ${String.fromCharCode(65 + q.answer)})
                ${correct}
            </p>

            <p class="${status}">
                Your Answer:
                ${userAnswer}
            </p>

            <p class="eng">
                <strong>English:</strong>
                ${q.solution}
            </p>

            <div class="odia">
                <strong>ଓଡ଼ିଆ:</strong>
                ${q.odia}
            </div>

            <p style="margin-top:10px;">
                <strong>Why:</strong>
                ${q.why}
            </p>

        `;

        solutions.appendChild(div);

    });

    document.getElementById("result").style.display = "block";

    document.getElementById("result").scrollIntoView({
        behavior:"smooth"
    });

}


const timer = setInterval(function(){

    if(timeLeft <= 0){

        clearInterval(timer);

        if(!submitted){

            submitQuiz();

        }

        return;

    }

    timeLeft--;

    const minutes =
        Math.floor(timeLeft / 60);

    const seconds =
        timeLeft % 60;

    document.getElementById("timer").innerText =
        String(minutes).padStart(2,"0") +
        ":" +
        String(seconds).padStart(2,"0");

},1000);


renderQuestion();

</script>

</body>
</html>
